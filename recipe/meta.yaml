{% set name = "findiff" %}
{% set version = "0.16.1" %}

package:
  name: "{{ name|lower }}"
  version: "{{ version }}"

source:
  url: "https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz"
  sha256: 0fa05d7c5f439d44f6fd54d7eba16def82254b01dc0a7161dd744170bfef1e25

build:
  number: 0
  script: "{{ PYTHON }} -m pip install . -vv"
  noarch: python

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools >=64
    - setuptools-scm >=6.2
  run:
    - python >={{ python_min }}
    - numpy
    - scipy
    - sympy

test:
  commands:
    - pip check
  requires:
    - python {{ python_min }}
    - pip
  imports:
    - findiff

about:
  home: "https://github.com/maroba/findiff"
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: "A Python package for finite difference derivatives in any number of dimensions."

extra:
  recipe-maintainers:
    - tnigon
    - maroba
    - og113
